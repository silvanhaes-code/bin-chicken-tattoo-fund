<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 0 320 284" width="320" height="284"
     role="img" aria-label="Illustration of an ankle with a bin chicken tattoo — an ibis standing on a wheelie bin">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f3d3ba" />
      <stop offset="0.55" stop-color="#e8bd9c" />
      <stop offset="1" stop-color="#d7a181" />
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <path id="legShape" d="M186 -4 L184 122 C186 154 190 176 202 194 C220 214 252 226 296 232
                           C320 236 330 250 312 259 C252 270 186 270 146 262
                           C108 255 88 236 86 204 C84 170 88 142 90 116 L88 -4 Z" />
    <clipPath id="legClip"><use href="#legShape" /></clipPath>
  </defs>

  <rect x="-40" y="-40" width="520" height="420" fill="#f6efe3" />
  <circle cx="160" cy="150" r="155" fill="url(#bg)" />

  <!-- lower leg + foot, seen from the outer side -->
  <use href="#legShape" fill="url(#skin)" />

  <g clip-path="url(#legClip)">
    <!-- shin / achilles shading -->
    <path d="M86 0 C96 60 92 154 112 204 C96 192 82 152 82 90 Z" fill="#c98f6f" opacity="0.32" />
    <path d="M186 0 C180 70 186 152 208 198 L222 212 L186 208 Z" fill="#ffffff" opacity="0.16" />
    <!-- ankle bone -->
    <ellipse cx="150" cy="212" rx="20" ry="16" fill="#ffffff" opacity="0.22" />
    <!-- heel + instep shading -->
    <path d="M100 216 C112 246 146 260 200 264 L150 264 C110 258 94 242 96 216 Z" fill="#c98f6f" opacity="0.3" />
    <path d="M204 204 C236 222 276 230 316 234 L304 242 C258 236 218 224 196 210 Z" fill="#ffffff" opacity="0.2" />
    <!-- toes -->
    <g fill="none" stroke="#c98f6f" stroke-width="2" opacity="0.5" stroke-linecap="round">
      <path d="M300 233 C306 241 306 250 300 256" />
      <path d="M276 231 C282 240 282 249 276 255" />
      <path d="M254 229 C260 238 260 247 254 253" />
    </g>

    <!-- ~~~ THE TATTOO ~~~ -->
    <g transform="translate(92 100) scale(0.82)" opacity="0.86" stroke="#22323f" fill="none"
       stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- wheelie bin -->
      <path d="M26 76 L32 112 L74 112 L80 76 Z" stroke-width="4" />
      <path d="M22 76 L84 76" stroke-width="4.6" />
      <path d="M30 90 L76 90" stroke-width="2.4" />
      <path d="M84 74 C93 66 100 59 105 52" stroke-width="6" />
      <circle cx="37" cy="117" r="4.8" />
      <circle cx="69" cy="117" r="4.8" />

      <!-- the bin chicken itself -->
      <g transform="translate(6 -10) scale(0.92)">
        <path d="M50 62 L47 88 M43 90 L47 88 L53 91" stroke-width="3.4" />
        <path d="M63 61 L66 87 M62 89 L66 87 L72 90" stroke-width="3.4" />
        <path d="M34 50 C32 35 46 24 61 25 C77 26 86 36 86 48 C86 63 71 72 57 71 C42 70 35 63 34 50 Z"
              stroke-width="4.4" />
        <path d="M43 44 C54 36 71 37 82 48" stroke-width="3.4" />
        <path d="M51 49 C58 45 67 46 74 52" stroke-width="2.6" />
        <path d="M49 57 C57 53 66 54 73 60" stroke-width="2.6" />
        <path d="M42 40 C37 32 33 24 30 16" stroke-width="7" />
        <path d="M76 36 C89 26 101 27 105 36 C96 33 88 36 82 42 C91 40 97 43 100 49 C92 46 83 49 77 55 Z"
              fill="#22323f" stroke="none" />
        <path d="M78 45 C85 47 89 51 90 56 C83 55 77 52 74 48 Z" fill="#22323f" stroke="none" />
        <ellipse cx="27" cy="13" rx="8.4" ry="6.6" transform="rotate(-24 27 13)" fill="#22323f" stroke="none" />
        <path d="M21 9 C9 18 2 34 4 52 L10 51 C8 34 14 20 25 13 Z" fill="#22323f" stroke="none" />
        <circle cx="28" cy="11" r="1.8" fill="#f3d3ba" stroke="none" />
      </g>
    </g>
  </g>

  <!-- leg outline on top -->
  <use href="#legShape" fill="none" stroke="#b9805f" stroke-width="2.5" stroke-linejoin="round" />
</svg>
